<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Elite · refined</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0f1a;
      color: #eceef2;
    }
    /* -------------------- palette -------------------- */
    :root {
      --gold: #d4af37;
      --gold-light: #e8c97a;
      --gold-glow: rgba(212, 175, 55, 0.25);
      --bg-deep: #0b0f1a;
      --bg-card: #141b2b;
      --bg-card-hover: #1c253a;
      --border-subtle: #2a3650;
      --text-muted: #9aa7c9;
      --text-light: #f0f2f8;
    }

    /* navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 5%;
      background: rgba(11, 15, 26, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(145deg, #d4af37, #a8861e);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(212,175,55,0.3);
    }
    .logo-icon i { font-size: 1.7rem; color: #0b0f1a; }
    .logo-text {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #d4af37, #f5d78a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }
    .nav-links {
      display: flex;
      gap: 2.2rem;
      align-items: center;
    }
    .nav-links a {
      color: #9aa7c9;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: 0.2s;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
    }
    .nav-links a:hover, .nav-links a.active {
      color: #d4af37;
      border-bottom-color: #d4af37;
    }

    /* container */
    .container {
      max-width: 1240px;
      margin: 2rem auto;
      padding: 0 2rem;
    }

    /* profile header */
    .profile-header {
      background: linear-gradient(145deg, #141b2b, #0e1422);
      border-radius: 32px;
      padding: 2rem 2.5rem;
      border: 1px solid #2a3650;
      display: flex;
      gap: 2.5rem;
      flex-wrap: wrap;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      margin-bottom: 2.5rem;
    }
    .avatar-area {
      text-align: center;
      flex-shrink: 0;
    }
    .avatar-ring {
      width: 140px;
      height: 140px;
      background: linear-gradient(135deg, #d4af37, #a8861e);
      border-radius: 50%;
      padding: 4px;
      transition: 0.3s;
      box-shadow: 0 0 30px rgba(212,175,55,0.2);
    }
    .avatar-ring:hover { transform: scale(1.04); }
    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #141b2b;
    }
    .badge-tag {
      display: inline-block;
      background: linear-gradient(135deg, #d4af37, #b8942a);
      color: #0b0f1a;
      padding: 6px 20px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-top: 0.8rem;
      letter-spacing: 0.5px;
    }
    .profile-info {
      flex: 1;
      min-width: 240px;
    }
    .profile-info h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f0f2f8, #d4af37);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.2rem;
    }
    .info-label {
      font-size: 0.7rem;
      color: #9aa7c9;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 0.2rem;
    }
    .info-value {
      font-size: 1rem;
      font-weight: 500;
      margin: 4px 0 16px 0;
      color: #d4af37;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin: 1rem 0 1.4rem 0;
    }
    .stat-card {
      background: rgba(20, 27, 43, 0.7);
      backdrop-filter: blur(6px);
      padding: 1rem 0.8rem;
      border-radius: 18px;
      text-align: center;
      border: 1px solid #2a3650;
      transition: 0.25s;
    }
    .stat-card:hover {
      border-color: #d4af37;
      transform: translateY(-4px);
      background: rgba(26, 38, 60, 0.8);
    }
    .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: #d4af37;
      line-height: 1.2;
    }
    .stat-label {
      font-size: 0.7rem;
      color: #9aa7c9;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .logout-btn {
      background: rgba(225,30,40,0.1);
      border: 1px solid #e11e28;
      color: #f28b8b;
      padding: 10px 28px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
    }
    .logout-btn:hover {
      background: #e11e28;
      color: white;
      box-shadow: 0 0 20px rgba(225,30,40,0.3);
    }

    /* bookings */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.8rem;
    }
    .section-header h2 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #d4af37;
      letter-spacing: -0.3px;
    }
    .section-header h2 i { margin-right: 12px; }

    .booking-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.8rem;
    }

    .booking-card {
      background: linear-gradient(145deg, #141b2b, #0f1626);
      border-radius: 24px;
      padding: 1.5rem;
      border: 1px solid #2a3650;
      transition: 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .booking-card:hover {
      transform: translateY(-6px);
      border-color: #d4af37;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      background: linear-gradient(145deg, #1c253a, #141b2b);
    }
    .booking-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 5px;
      height: 100%;
      background: linear-gradient(180deg, #d4af37, #a8861e);
      border-radius: 0 4px 4px 0;
    }
    .booking-movie {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: #d4af37;
      margin-bottom: 0.9rem;
    }
    .confirmed-badge {
      background: rgba(76,175,80,0.15);
      color: #66bb6a;
      padding: 4px 14px;
      border-radius: 60px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      border: 1px solid rgba(76,175,80,0.2);
    }
    .detail-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: #9aa7c9;
      margin-bottom: 7px;
    }
    .detail-item i {
      width: 20px;
      color: #d4af37;
      text-align: center;
    }
    .detail-item strong {
      color: #eceef2;
      font-weight: 600;
    }
    .price-tag {
      margin-top: 0.9rem;
      padding-top: 0.9rem;
      border-top: 1px dashed #2a3650;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price-amount {
      font-size: 1.3rem;
      font-weight: 800;
      color: #d4af37;
    }
    .empty-state {
      text-align: center;
      padding: 3.5rem 2rem;
      background: #141b2b;
      border-radius: 28px;
      border: 1px dashed #2a3650;
      grid-column: 1 / -1;
    }
    .empty-state i {
      font-size: 3.2rem;
      color: #d4af37;
      opacity: 0.4;
      margin-bottom: 1rem;
    }
    .empty-state p { color: #9aa7c9; margin-bottom: 0.8rem; }
    .empty-state a {
      color: #d4af37;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid #d4af37;
    }

    footer {
      background: #070a12;
      text-align: center;
      padding: 1.5rem;
      margin-top: 3.5rem;
      border-top: 1px solid #2a3650;
      color: #6f7d9e;
      font-size: 0.85rem;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #d4af37;
      color: #0b0f1a;
      padding: 14px 28px;
      border-radius: 60px;
      font-weight: 700;
      z-index: 3000;
      animation: slideIn 0.3s ease;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      font-size: 0.95rem;
    }
    @keyframes slideIn {
      0% { transform: translateX(100%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    @media (max-width: 700px) {
      .navbar { flex-direction: column; align-items: stretch; }
      .nav-links { justify-content: center; gap: 1.2rem; }
      .profile-header { flex-direction: column; align-items: center; text-align: center; padding: 1.5rem; }
      .stats-grid { grid-template-columns: 1fr; }
      .container { padding: 0 1rem; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo-wrap">
    <div class="logo-icon"><i class="fas fa-crown"></i></div>
    <span class="logo-text">CINEMA ELITE</span>
  </div>
  <div class="nav-links">
    <a href="Home.html">Home</a>
    <a href="Movie.html">Movies</a>
    <a href="Profile.html" class="active">Profile</a>
  </div>
</nav>

<div class="container">
  <!-- profile header -->
  <div class="profile-header">
    <div class="avatar-area">
      <div class="avatar-ring">
        <img src="https://ui-avatars.com/api/?background=d4af37&color=0b0f1a&bold=true&size=140&name=U" alt="avatar" id="avatarImg">
      </div>
      <span class="badge-tag" id="userBadge">Movie Lover</span>
    </div>
    <div class="profile-info">
      <h1 id="displayName">Welcome Back</h1>
      <div class="info-label">Email Address</div>
      <div class="info-value" id="userEmailDisplay">—</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-number" id="totalBookings">0</div><div class="stat-label">Tickets</div></div>
        <div class="stat-card"><div class="stat-number" id="totalSpent">$0</div><div class="stat-label">Spent</div></div>
        <div class="stat-card"><div class="stat-number" id="totalMovies">0</div><div class="stat-label">Movies</div></div>
      </div>
      <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
    </div>
  </div>

  <!-- bookings -->
  <div class="bookings-section">
    <div class="section-header">
      <h2><i class="fas fa-ticket-alt"></i> My Tickets</h2>
      <span id="bookingCountLabel" style="color:#9aa7c9; font-weight:500;"><i class="fas fa-film" style="color:#d4af37;"></i> 0 bookings</span>
    </div>
    <div class="booking-grid" id="bookingGridContainer">
      <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i><p>Loading your bookings…</p></div>
    </div>
  </div>
</div>

<footer>
  <p>© 2025 CINEMA ELITE — Premium Cinema Experience</p>
</footer>

<script>
  (function() {
    // ---------- mock data & helpers ----------
    const API_BASE = 'http://localhost:3000/api';

    let currentUser = null;
    let currentUserId = null;
    let userBookings = [];

    function showToast(message, isError = false) {
      const old = document.querySelector('.toast');
      if (old) old.remove();
      const div = document.createElement('div');
      div.className = 'toast';
      div.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${message}`;
      div.style.background = isError ? '#c62828' : '#d4af37';
      div.style.color = isError ? '#fff' : '#0b0f1a';
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 3200);
    }

    function loadUser() {
      let raw = localStorage.getItem('currentUser');
      if (raw) {
        try {
          currentUser = JSON.parse(raw);
          currentUserId = currentUser.userId || currentUser.email;
          updateProfileUI();
          return;
        } catch(e) {}
      }
      // fallback demo
      currentUserId = 'demo_' + Date.now();
      currentUser = { userId: currentUserId, email: 'moviefan@cinema.com', username: 'MovieFan' };
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      updateProfileUI();
    }

    function updateProfileUI() {
      if (!currentUser) return;
      const name = currentUser.username || currentUser.email?.split('@')[0] || 'Cinema Fan';
      document.getElementById('displayName').innerText = name.charAt(0).toUpperCase() + name.slice(1);
      document.getElementById('userEmailDisplay').innerHTML = `<i class="fas fa-envelope" style="color:#d4af37;"></i> ${currentUser.email}`;
      const initial = name.charAt(0).toUpperCase();
      document.getElementById('avatarImg').src = `https://ui-avatars.com/api/?background=d4af37&color=0b0f1a&bold=true&size=140&name=${initial}`;
    }

    function loadBookings() {
      if (!currentUserId) return;

      // first try localStorage
      const stored = localStorage.getItem('myBookings');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length) {
            userBookings = parsed.map(b => ({
              ...b,
              id: b.bookingId || b.id || 'BK' + Date.now(),
              movieTitle: b.movieTitle || 'Movie',
              seats: b.seats || ['A1'],
              total: b.total || 12.00,
              date: b.date || new Date().toISOString().slice(0,10),
              time: b.time || '7:30 PM',
              theater: b.theater || 'IMAX Hall',
              paymentMethod: b.paymentMethod || 'Card',
              status: b.status || 'Confirmed'
            }));
            renderBookings();
            updateStats();
            return;
          }
        } catch(e) {}
      }

      // try API
      fetch(`${API_BASE}/bookings/user/${encodeURIComponent(currentUserId)}`)
        .then(res => {
          if (!res.ok) throw new Error('API error');
          return res.json();
        })
        .then(data => {
          if (Array.isArray(data) && data.length) {
            userBookings = data;
          } else {
            userBookings = getSampleBookings();
          }
          renderBookings();
          updateStats();
        })
        .catch(() => {
          userBookings = getSampleBookings();
          renderBookings();
          updateStats();
        });
    }

    function getSampleBookings() {
      return [
        { id: 'BK001', movieTitle: 'The Dark Knight', seats: ['A5','A6'], total: 30.00, date: '2025-06-15', time: '7:00 PM', theater: 'IMAX Central', paymentMethod: 'Credit Card', status: 'Confirmed' },
        { id: 'BK002', movieTitle: 'Inception', seats: ['B3'], total: 15.00, date: '2025-06-20', time: '4:00 PM', theater: '4K Luxe', paymentMethod: 'ABA Bank', status: 'Confirmed' },
        { id: 'BK003', movieTitle: 'Interstellar', seats: ['C1','C2','C3'], total: 45.00, date: '2025-06-25', time: '10:00 PM', theater: 'Gold Class', paymentMethod: 'Wing', status: 'Confirmed' }
      ];
    }

    function renderBookings() {
      const container = document.getElementById('bookingGridContainer');
      if (!userBookings || userBookings.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-ticket-alt"></i>
            <p>You haven't booked any tickets yet</p>
            <a href="#">Browse Movies <i class="fas fa-arrow-right"></i></a>
          </div>
        `;
        return;
      }

      container.innerHTML = userBookings.map((b, idx) => {
        const seats = Array.isArray(b.seats) ? b.seats.join(', ') : (b.seats || 'A1');
        const total = parseFloat(b.total || 0).toFixed(2);
        const date = b.date || '2025-06-30';
        const time = b.time || '7:30 PM';
        const theater = b.theater || 'IMAX Hall 1';
        const method = b.paymentMethod || 'Card';
        const status = b.status || 'Confirmed';
        const title = b.movieTitle || 'Movie';
        const bid = b.id || b.bookingId || `BK${idx+1}`;

        return `
          <div class="booking-card">
            <div class="booking-movie">
              <span><i class="fas fa-film" style="margin-right:8px;"></i>${title}</span>
              <span class="confirmed-badge"><i class="fas fa-check-circle"></i> ${status}</span>
            </div>
            <div class="detail-item"><i class="fas fa-hashtag"></i> Booking ID: <strong>${bid}</strong></div>
            <div class="detail-item"><i class="fas fa-calendar-alt"></i> Date: <strong>${date}</strong> at <strong>${time}</strong></div>
            <div class="detail-item"><i class="fas fa-chair"></i> Seats: <strong>${seats}</strong></div>
            <div class="detail-item"><i class="fas fa-theater-masks"></i> Theater: <strong>${theater}</strong></div>
            <div class="detail-item"><i class="fas fa-credit-card"></i> Payment: <strong>${method}</strong></div>
            <div class="price-tag">
              <span><i class="fas fa-tag"></i> Total Paid</span>
              <span class="price-amount">$${total}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateStats() {
      const totalTickets = userBookings.reduce((sum, b) => {
        const seats = Array.isArray(b.seats) ? b.seats.length : 1;
        return sum + seats;
      }, 0);
      const totalSpent = userBookings.reduce((sum, b) => sum + (parseFloat(b.total) || 0), 0).toFixed(2);
      const uniqueMovies = new Set(userBookings.map(b => b.movieTitle)).size;

      document.getElementById('totalBookings').innerText = totalTickets;
      document.getElementById('totalSpent').innerText = `$${totalSpent}`;
      document.getElementById('totalMovies').innerText = uniqueMovies;
      document.getElementById('bookingCountLabel').innerHTML = `<i class="fas fa-film" style="color:#d4af37;"></i> ${userBookings.length} bookings`;
    }

    window.handleLogout = function() {
      if (confirm('Sign out ?')) {
        localStorage.removeItem('currentUser');
        localStorage.removeItem('myBookings');
        showToast('Signed out', false);
        setTimeout(() => { window.location.href = 'home.html'; }, 800);
      }
    };

    // init
    loadUser();
    loadBookings();

    // auto refresh
    setInterval(() => {
      renderBookings();
      updateStats();
    }, 6000);

    window.showToast = showToast;
  })();
</script>
</body>
</html>
